name: sync

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

# 同步更新 state.json，串行运行避免并发覆盖
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: 安装依赖
        run: npm ci

      - name: 拉取 RSS 并生成仪表盘
        run: node scripts/fetch.mjs
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}
          FLUXSIFT_FEED_URL: ${{ secrets.FLUXSIFT_FEED_URL }}

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html dist/state.json
          if git diff --staged --quiet; then
            echo "无更新"
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
