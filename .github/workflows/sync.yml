name: sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 防止并发重入，不中断进行中的运行
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: 安装依赖
        run: npm ci

      - name: 拉取 RSS 并生成仪表盘
        run: node scripts/fetch.mjs
        env:
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html dist/state.json
          if git diff --staged --quiet; then
            echo "无更新"
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 触发 Pages 部署
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml || true
