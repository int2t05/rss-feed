<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSS 订阅</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#0d1117;color:#c9d1d9;line-height:1.7;font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:48px 20px}
h1{font-size:1.15rem;font-weight:600;color:#e6edf3;margin-bottom:8px}
.meta{color:#7d8590;font-size:.85rem;margin-bottom:32px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:24px;margin-bottom:16px}
.card p{margin:8px 0}
code{background:#21262d;padding:2px 6px;border-radius:3px;font-size:.85em}
.note{color:#7d8590;font-size:.8rem}
@media(prefers-color-scheme:light){body{background:#fff;color:#1f2328}h1{color:#1f2328}.card{background:#f6f8fa;border-color:#d0d7de}code{background:#eaeef2}.note{color:#57606a}}
</style>
</head>
<body>
<div class="wrap">
<h1>RSS 订阅</h1>
<div class="meta">等待首次同步</div>
<div class="card">
<p>本页面由 GitHub Actions 每 30 分钟自动生成，当前尚未同步。</p>
<p class="note">首次使用：</p>
<p>1. 仓库 <strong>Actions</strong> 标签页 → <code>sync</code> → <strong>Run workflow</strong></p>
<p>2. 等待约 1 分钟，刷新本页</p>
<p class="note">订阅列表见 <code>config.txt</code>，路由速查见 <code>reference/rsshub-routes.md</code>。</p>
</div>
</div>
</body>
</html>
